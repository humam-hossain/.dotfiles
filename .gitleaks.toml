# =============================================================================
# GROUP 3 — GSD install manifest digests (executor triage, plan 17-04)
#
# Four working-tree findings in .claude/gsd-file-manifest.json, all rule
# generic-api-key, at the entries for gsd-core/bin/lib/api-coverage.cjs,
# gsd-core/bin/lib/secrets.cjs, gsd-core/bin/lib/token-scanner.cjs and
# gsd-core/references/api-coverage.md. The rule fires because those KEY names
# contain credential-shaped words (secrets, token, api) next to a high-entropy
# value.
#
# The values are SHA-256 content digests, and that is a checked claim, not an
# inference: all 735 values in the file are exactly 64 lowercase hex characters,
# and the four flagged ones recompute byte-for-byte as
# sha256(<the file named by the key>) against both the repo-local and the
# user-level .claude runtime root. No human judgement is involved.
#
# The file is untracked and gitignored (.gitignore:4 `.claude/`), so it cannot
# reach a commit; it is machine-local GSD install state.
#
# Scoping: the path AND a line regex requiring the JSON `"<key>": "<64 lowercase
# hex>"` manifest shape, under `condition = "AND"`. Line numbers are NOT used —
# the manifest is regenerated on every GSD update and they would drift. A
# credential written into this file in any other shape is still reported.
# =============================================================================

[[allowlists]]
description = "SHA-256 content digests in the untracked, gitignored GSD install manifest; every value is 64 lowercase hex and the four flagged entries recompute exactly as sha256 of the file each key names, so they are integrity hashes and not credentials (executor triage, verified by recomputation, 2026-09-12)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^\.claude/gsd-file-manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"]+":\s*"[0-9a-f]{64}",?\s*$''']

