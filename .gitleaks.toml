# Phase 17 / FIX-06 — gitleaks allowlist (D-13).
#
# Every entry in this file records a TRIAGE DECISION, not a convenience
# suppression. Each `description` carries the one-line reason the match is not a
# credential, so a later reader can re-audit the decision without re-deriving it.
#
# Provenance: the plan 17-03 `blocking-human` checkpoint ("triage the tracked
# .env before any FIX-06 work") and the plan 17-04 `blocking-human` checkpoint
# ("triage the history findings"). The operator answered both on 2026-09-12.
#
# Requires gitleaks >= 8.19 for the `[[allowlists]]` array-of-tables form and
# >= 8.25 for `condition` / `targetRules`. Installed: Arch `extra/gitleaks`
# 8.30.1-1, /usr/bin/gitleaks, pacman-owned.
#
# =============================================================================
# THE SCOPING IDIOM — read this before adding an entry.
#
# Every `[[allowlists]]` entry in this file MUST carry BOTH of the following,
# and neither is cosmetic. Both were established empirically against the
# installed 8.30.1 binary during plan 17-04, after the 17-03 entries were found
# to be doing the opposite of what they claimed.
#
#   condition = "AND"
#     Without it the default is OR, which means a multi-key entry allowlists a
#     finding that matches ANY ONE key. An entry written as `paths` + `regexes`
#     and INTENDED to mean "this path AND this line shape" actually means "this
#     whole path, OR that line shape anywhere". That is a blanket path
#     suppression wearing the costume of a narrow one.
#     Measured on the real history scan: one probe entry with
#     commits=[44f9bc38] + paths=[^arch/wakatime\.sh$] suppressed 1 finding
#     under `condition = "AND"` and 4 under the default.
#
#   targetRules = [...]
#     Without it, a global allowlist carrying `paths` makes gitleaks skip the
#     matching file WHOLESALE in `gitleaks dir` mode, before reading a byte of
#     it — `condition = "AND"` does NOT prevent this. Measured: a fixture
#     holding a live-shaped `export ANTHROPIC_API_KEY=<40 random chars>` at
#     stow/zsh/.zshrc was reported by the built-in ruleset ("scanned ~66 bytes,
#     leaks found: 1") and went completely unseen under a paths-bearing global
#     allowlist ("scanned ~0 bytes, no leaks found",
#     `DBG skipping file: global allowlist path=stow/zsh/.zshrc`). Adding
#     targetRules restored detection. This matters concretely here:
#     debian/wakatime.sh, ubuntu/wakatime.sh and arch/wakatime.sh all EXIST in
#     the working tree, so the history entries below would blind three live
#     files without it.
#
# A path-only allowlist is the "green produced by narrowing the instrument"
# this phase's prohibition names. It is indistinguishable from a clean repo.
# =============================================================================

title = "dotfiles secret-scan allowlist (Phase 17 FIX-06)"

[extend]
useDefault = true

# =============================================================================
# GROUP 1 — pre-redacted placeholder strings (operator triage, plan 17-03)
#
# All three carry the literal token `REDACTED` as their value and all three sit
# in comments. They are placeholders left behind by an earlier redaction pass,
# not live values. The source files were not edited to remove them.
#
# Each entry is scoped to the file path AND a line regex requiring the literal
# `REDACTED`, joined by `condition = "AND"`, so a real credential written to the
# same line later is still reported. `targetRules` keeps the path clause from
# turning into a whole-file skip.
#
# Note for a future reader: the built-in 8.30.1 ruleset does not flag these two
# zshrc lines in the working tree on its own. These entries are retained
# anyway, correctly scoped, because they are the operator's decision on record
# and because the same lines DO match in older revisions of the file.
# =============================================================================

[[allowlists]]
description = "Commented-out ANTHROPIC_AUTH_TOKEN export in the zsh rc whose value is the literal placeholder token REDACTED, not a credential (operator triage, 2026-09-12)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^stow/zsh/\.zshrc$''']
regexTarget = "line"
regexes = ['''#\s*export\s+ANTHROPIC_AUTH_TOKEN=REDACTED''']

[[allowlists]]
description = "Commented-out ANTHROPIC_API_KEY export in the zsh rc whose value is the literal placeholder token REDACTED, not a credential (operator triage, 2026-09-12)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^stow/zsh/\.zshrc$''']
regexTarget = "line"
regexes = ['''#\s*export\s+ANTHROPIC_API_KEY=REDACTED''']

[[allowlists]]
description = "AccuWeather API key in the Waybar config's // comment block whose value is the literal placeholder token REDACTED, not a credential (operator triage, 2026-09-12)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^stow/waybar/\.config/waybar/config\.jsonc$''']
regexTarget = "line"
regexes = ['''^\s*//.*REDACTED''']

# =============================================================================
# GROUP 2 — git-history findings (operator triage, plan 17-04, 2026-09-12)
#
# Ten findings across seven commits and five paths, two credentials:
#   - a WakaTime API key (entropy 3.8638263) in the three wakatime.sh installers
#   - an AccuWeather API key (entropy 4.53891) in the two waybar config.jsonc
#
# OPERATOR VERDICT: "Both keys already dead / never live." No rotation is
# outstanding, no history rewrite is performed, and no tag is deleted.
#
# Reachability, verified at triage time rather than assumed:
#   - NONE of the seven commits is an ancestor of local HEAD or of origin/main
#     (origin/main = f3144919). Main's history is already clean of them, so a
#     `git filter-repo` would have rewritten every one of 2687 commits to remove
#     commits main does not contain.
#   - Four of the seven (44f9bc38, a5c2f3c5, ba2c4f00, 86de82ea) ARE reachable
#     from tags v0.1, v0.2, v1.0 and v1.1. `git ls-remote origin` shows v0.2 and
#     v1.0 are PUBLISHED on git@github.com:humam-hossain/.dotfiles.git.
#   - The operator's decision is to leave every tag in place, local and remote.
#
# So the honest one-line framing each entry below carries: reachable from
# published tags v0.2 and v1.0 but not from main; credential confirmed dead by
# the operator on 2026-09-12; no rewrite performed by operator decision.
#
# Scoping: each entry pins ONE commit AND ONE path under `condition = "AND"`.
# The commit SHA is the fingerprint component (a gitleaks fingerprint is
# `commit:file:rule:line`), so this is the path-plus-fingerprint scope the
# phase requires. A line regex is deliberately NOT used here: the only regex
# that would pin the line further is the secret value itself, and writing a
# matched value into this file is prohibited.
# =============================================================================

