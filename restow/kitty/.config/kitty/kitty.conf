# Theming (static, pure black; matugen/quickshell kitty-theme no longer included)
background_opacity 1.0
background #000000
foreground #f1f1f1
cursor #f1f1f1
selection_background #222222
selection_foreground #f1f1f1
color0  #000000
color8  #505050
color1  #a06060
color9  #b87878
color2  #8a9a78
color10 #a0b08e
color3  #b09a68
color11 #c4ae80
color4  #8c8cac
color12 #a4a4c4
color5  #9a7a9a
color13 #b292b2
color6  #6f9a9a
color14 #88b2b2
color7  #c1c1c1
color15 #f1f1f1

# Font
font_family      DepartureMono Nerd Font Mono
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Padding (consistency with foot / upstream layout)
window_margin_width 5

# No close confirmation
confirm_os_window_close 0

# Shell - retain user login shell (omitting upstream fish per D-02)
shell zsh

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
