# This config file is managed in dotfiles (stow/zram)
# Sourced by systemd-zram-generator to create a high-performance in-memory compressed swap device.

[zram0]
# Allocate zram device size up to half of physical RAM (capped at 8192MB)
# Dynamic allocation only consumes physical memory when actual swap pages are stored.
zram-size = min(ram / 2, 8192)

# Fast modern compression algorithm
compression-algorithm = zstd

# High priority so the kernel uses ultra-fast zram before any disk-based swap
swap-priority = 100
