[font]
size = 10.0

[font.normal]
family = "DepartureMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "DepartureMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "DepartureMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "DepartureMono Nerd Font Mono"
style = "Bold Italic"

[colors.primary]
background = "#000000"
foreground = "#f1f1f1"

[window]
opacity = 1.0
